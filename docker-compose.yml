services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  dashboard:
    build: .
    environment:
      - S3_BUCKET=${S3_BUCKET}
      - AWS_REGION=${AWS_REGION:-ap-south-2}
      - QDRANT_HOST=qdrant
    depends_on:
      - qdrant
    env_file:
      - .env
    restart: unless-stopped
    # NOTE: no "ports" or "volumes" here on purpose — those differ between
    # local dev and EC2, and get added by docker-compose.override.yml
    # (local) or docker-compose.ec2.yml (EC2). See those files for why.

  agents:
    build: .
    environment:
      - S3_BUCKET=${S3_BUCKET}
      - AWS_REGION=${AWS_REGION:-ap-south-2}
      - QDRANT_HOST=qdrant
    depends_on:
      - qdrant
    env_file:
      - .env
    command: ["python", "-m", "src.agents.run_day3"]
    profiles: ["batch"]

volumes:
  qdrant_data:
