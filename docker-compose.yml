services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  dashboard:
    build: .
    environment:
      - S3_BUCKET=${S3_BUCKET}
      - AWS_REGION=${AWS_REGION:-ap-south-2}
      - QDRANT_HOST=qdrant
    depends_on:
      - qdrant
    env_file:
      - .env
    volumes:
      - agent_queue_data:/app/data
      # ^ FIX (v1.1): agent_queue.db previously lived inside the container's
      # writable layer, which is wiped on every rebuild/recreate — the
      # Agent Action Log tab would silently reset to empty. Named volume
      # persists it across restarts, same pattern as qdrant_data above.
      # NOTE: forecasts.parquet/insight_cards.json still get freshly
      # re-downloaded from S3 into this same folder on every container
      # start (via entrypoint.sh) — only agent_queue.db needs persistence.
      # "ports" still deliberately absent here — that differs between
      # local dev and EC2, added by docker-compose.override.yml / .ec2.yml.
    restart: unless-stopped

  agents:
    build: .
    environment:
      - S3_BUCKET=${S3_BUCKET}
      - AWS_REGION=${AWS_REGION:-ap-south-2}
      - QDRANT_HOST=qdrant
    depends_on:
      - qdrant
    env_file:
      - .env
    volumes:
      - agent_queue_data:/app/data
      # ^ SAME volume as dashboard — both need to read/write the same
      # agent_queue.db, so they share this volume rather than each having
      # their own separate copy.
    command: ["python", "-m", "src.agents.run_day3"]
    profiles: ["batch"]

volumes:
  qdrant_data:
  agent_queue_data:
